<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fonetiza — Conversor de Ortografia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Fonetiza</h1>
      <p>Conversor experimental para uma ortografia simplificada baseada na pronúncia.</p>
    </header>

    <section class="card">
      <label for="entrada">Texto original</label>
      <textarea id="entrada" placeholder="Cole seu texto aqui..."></textarea>

      <div class="actions">
        <button id="converter">Converter</button>
        <button id="limpar" class="secondary">Limpar</button>
      </div>

      <label for="saida">Texto convertido</label>
      <textarea id="saida" readonly placeholder="O resultado aparecerá aqui..."></textarea>
      <p id="status" class="status"></p>
    </section>
  </main>
  <script src="conversor.js"></script>
</body>
</html>
